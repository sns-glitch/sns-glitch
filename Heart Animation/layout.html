<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Beating Heart</title>

    <style>
        body{
            margin:0;
            overflow:hidden;
            background:black;
        }

        canvas{
            display:block;
        }
    </style>
</head>
<body>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.164.1/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://unpkg.com/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";
import { EffectComposer } from "https://unpkg.com/three@0.164.1/examples/jsm/postprocessing/EffectComposer.js";
import { RenderPass } from "https://unpkg.com/three@0.164.1/examples/jsm/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "https://unpkg.com/three@0.164.1/examples/jsm/postprocessing/UnrealBloomPass.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 0, 8);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHTING

const ambient = new THREE.AmbientLight(0xff3333, 2);
scene.add(ambient);

const pointLight = new THREE.PointLight(0xff0000, 25);
pointLight.position.set(0,0,5);
scene.add(pointLight);

// BLOOM

const composer = new EffectComposer(renderer);

composer.addPass(
    new RenderPass(scene,camera)
);

const bloom = new UnrealBloomPass(
    new THREE.Vector2(
        window.innerWidth,
        window.innerHeight
    ),
    2,
    0.5,
    0
);

composer.addPass(bloom);

// PARTICLES

const particleCount = 2000;

const particlesGeometry =
    new THREE.BufferGeometry();

const positions = [];

for(let i=0;i<particleCount;i++){

    positions.push(
        (Math.random()-0.5)*25,
        (Math.random()-0.5)*25,
        (Math.random()-0.5)*25
    );
}

particlesGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
        positions,
        3
    )
);

const particlesMaterial =
    new THREE.PointsMaterial({
        color:0xff2222,
        size:0.03
    });

const particles =
    new THREE.Points(
        particlesGeometry,
        particlesMaterial
    );

scene.add(particles);

// HEART MODEL

let heart;

const loader = new GLTFLoader();

/*
Replace with your heart model.
You can download a free .glb anatomical heart model.
*/

loader.load(
    "heart.glb",

    (gltf)=>{

        heart = gltf.scene;

        heart.scale.set(2,2,2);

        heart.traverse((child)=>{

            if(child.isMesh){

                child.material =
                    new THREE.MeshStandardMaterial({

                    color:0xaa0000,
                    emissive:0xff0000,
                    emissiveIntensity:2.5,

                });

            }

        });

        scene.add(heart);

    }
);

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableZoom = false;

const clock = new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const t = clock.getElapsedTime();

    particles.rotation.y += 0.0005;

    if(heart){

        // heartbeat

        const beat =
            1 +
            Math.sin(t * 6) * 0.08;

        heart.scale.set(
            2 * beat,
            2 * beat,
            2 * beat
        );

        heart.rotation.y += 0.003;

        pointLight.intensity =
            20 +
            Math.sin(t * 6) * 8;
    }

    composer.render();
}

animate();

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        composer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
